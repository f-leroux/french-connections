name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate puzzles
        run: python3 scripts/validate_puzzles.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        working-directory: client
        # package-lock.json is gitignored, so install rather than `npm ci`.
        # CI=false stops react-scripts from failing the build on lint warnings.
        run: |
          npm install --no-audit --no-fund
          CI=false npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/build
          cname: www.frenchconnections.fr
